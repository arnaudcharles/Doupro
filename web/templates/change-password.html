{{define "change-password-page"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script nonce="{{.CSPNonce}}" src="/static/theme.js"></script>
  <script nonce="{{.CSPNonce}}" src="/static/csrf.js"></script>
  <title>DoUpRo · Change password</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center antialiased">
  <div class="w-full max-w-sm px-4">
    <div class="flex items-center justify-center gap-2 mb-6 text-xl font-semibold tracking-tight">
      <img src="/static/logo.png" alt="" class="h-7 w-7 rounded">
      <span class="text-brand">DoUpRo</span>
    </div>

    <div class="rounded-lg border border-gray-800 bg-gray-900/40 p-6">
      <h1 class="text-sm font-semibold mb-1">Set a real password</h1>
      <p class="text-xs text-gray-500 mb-4">
        This account is still using the default password. Choose a new one
        (8+ characters) before continuing — this is a one-time step.
      </p>

      <form id="change-password-form" class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Current password</label>
          <input name="current_password" type="password" class="w-full rounded-md bg-gray-950 border border-gray-800 px-2 py-1.5">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">New password</label>
          <input name="new_password" type="password" minlength="8" class="w-full rounded-md bg-gray-950 border border-gray-800 px-2 py-1.5">
        </div>
        <button type="submit" class="w-full rounded-md bg-badge-update text-white text-sm font-medium py-1.5 hover:opacity-90">
          Set password
        </button>
      </form>
      <p id="change-password-error" class="mt-2 text-sm text-state-stopped"></p>
    </div>
  </div>

  <script nonce="{{.CSPNonce}}">
    document.getElementById('change-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const resp = await fetch('/api/v1/auth/password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password: f.get('current_password'), new_password: f.get('new_password') }),
      });
      if (resp.ok) {
        location.href = '/';
        return;
      }
      const data = await resp.json().catch(() => ({}));
      document.getElementById('change-password-error').textContent =
        (data.error && data.error.message) || 'Failed to change password.';
    });
  </script>
</body>
</html>
{{end}}
