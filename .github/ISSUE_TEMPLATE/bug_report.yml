name: Bug report
description: Something isn't working the way it should
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please **do not** use
        this form for security vulnerabilities — see [SECURITY.md](https://github.com/arnaudcharles/DoUpRo/blob/main/SECURITY.md)
        for private reporting instead.

  - type: input
    id: version
    attributes:
      label: DoUpRo version / image tag or digest
      placeholder: "e.g. sharlihe/doupro:0.3.0 or the sha256 digest"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - docker run
        - docker compose
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        `docker logs doupro` output around the issue. **Redact anything
        sensitive** (tokens, credentials, internal hostnames you don't want
        public) before pasting.
      render: json

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Host OS:
        - Docker version:
        - Architecture (amd64/arm64):
