name: Feature request
description: Suggest an idea or improvement for DoUpRo
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before requesting, a quick look at [`docs/`](https://github.com/arnaudcharles/DoUpRo/tree/main/docs)
        and [`manuals/`](https://github.com/arnaudcharles/DoUpRo/tree/main/manuals)
        may already answer whether this is planned or how it fits the
        existing design.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the use case, not just the feature — this helps us find
        the best-fitting solution, which isn't always the one first
        imagined.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see, if you have something specific in mind.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or approaches you've tried or thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Containers
        - Schedule
        - Notifications
        - Logs
        - Settings
        - Stats
        - CLI
        - API
        - Web UI
        - Other / not sure
    validations:
      required: true
